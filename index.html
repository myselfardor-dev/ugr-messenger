/* UGR DARK PREMIUM refresh — layout behavior intentionally preserved */
:root{--bg:#08090e;--panel:#10121a;--panel2:#171a24;--line:#272b39;--muted:#9299ad;--text:#f4f6fc;--accent:#a78bfa;--accent2:#7655e8;--green:#58e0ad;--red:#ff788d}
body{background:radial-gradient(ellipse at 10% 0%,#22204244,transparent 38%),radial-gradient(ellipse at 90% 100%,#15334b22,transparent 35%),var(--bg)}
.app{background:linear-gradient(160deg,#11131b,#0c0e14);border:1px solid #202434;border-radius:0;box-shadow:0 0 45px #05060a66}
.sidebar{background:linear-gradient(180deg,#12141d,#0d0f15)}
.logo{background:linear-gradient(145deg,#80caff,#8f6bff 65%,#6235cf);box-shadow:0 7px 24px #7755ed44}
.brand-name{letter-spacing:2.5px}.brand-sub{color:#8a91a7}
.search input,.field{background:#171a24;border-color:#282e3d;transition:border-color .18s,box-shadow .18s}.search input:focus,.field:focus{border-color:#8270df;box-shadow:0 0 0 3px #8270df1c}
.chat{margin:3px 0;padding:12px;border:1px solid transparent;transition:background .16s,border-color .16s}.chat:hover{background:#1a1e2b;border-color:#252b3b}.chat.active{background:linear-gradient(110deg,#292442,#1a2534);border-color:#373457}
.avatar,.me-avatar{background:linear-gradient(145deg,#76bdf2,#8a68ec 70%,#5b43c2);box-shadow:0 4px 14px #7059ce25}
.main{background:radial-gradient(ellipse at 70% 0%,#2b285022,transparent 42%),#0c0e14}.topbar{background:#11141bdc;border-bottom-color:#242938;backdrop-filter:blur(14px)}
.messages{background-image:radial-gradient(#30344722 1px,transparent 1px);background-size:22px 22px}
.bubble{background:linear-gradient(145deg,#1b202a,#181b24);border-color:#2b3140;box-shadow:0 3px 12px #00000012}.bubble.mine{background:linear-gradient(145deg,#4c3b86,#393c79 85%);border-color:#5d579b;box-shadow:0 5px 18px #51458b25}

/* MOBILE PROFILE MODAL: prevent top clipping and allow full content scroll */
#modal.screen{
  align-items:flex-start;
  justify-content:center;
  padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#modal .panel{
  width:min(100%,410px);
  max-height:calc(var(--app-height, 100dvh) - max(10px, env(safe-area-inset-top)) - max(12px, env(safe-area-inset-bottom)));
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  margin:auto 0;
}
#modal .panel > .row{
  flex:0 0 auto;
  position:sticky;
  top:0;
  z-index:4;
  background:linear-gradient(145deg,#171a24,#12141c);
  padding-bottom:8px;
}
#modalBody.form{
  min-height:0;
  max-height:none;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  padding:4px 2px max(12px, env(safe-area-inset-bottom));
}
#modalBody .profile-preview{
  flex-shrink:0;
  min-height:90px;
}
@media(max-width:700px){
  #modal.screen{padding-left:10px;padding-right:10px}
  #modal .panel{max-height:calc(var(--app-height, 100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));}
}

.msg-tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;opacity:.7}.msg-tools button{background:#292538;border:1px solid #453a59;border-radius:8px;padding:4px 7px;font-size:12px}.msg-tools button:hover{opacity:1;background:#493477}.bubble:hover .msg-tools{opacity:1}.bubble .msg-tools{align-self:flex-start}.bubble.mine .msg-tools{align-self:flex-end}.search-hit{outline:2px solid #b59aff;outline-offset:3px}.message-search-result{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer}.message-search-result:hover{border-color:var(--accent)}.result-meta{color:var(--muted);font-size:11px;margin-bottom:5px}.result-text{white-space:pre-wrap;overflow-wrap:anywhere}.draft-label{font-size:10px;color:#c4a8ff;margin-left:6px}.topbar-tools{display:flex;gap:6px}.topbar-tools .smallbtn{padding:7px 9px}.bubble .reactions{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.reaction-pill{border:1px solid #65518b;background:#342849;border-radius:99px;padding:3px 8px;font-size:12px}


.reply-preview{padding:8px 10px;margin-bottom:7px;border-left:3px solid #a78bfa;background:#272333;border-radius:8px;color:#c9b9e8;font-size:12px;max-width:100%;overflow-wrap:anywhere}.msg-tools button{cursor:pointer}.forward-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.pinned-item{padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow-wrap:anywhere}

<body>
<div id="authScreen" class="screen">
 <div class="panel">
  <div class="logo">U</div><h1 style="margin-top:15px">UGR MESSENGER</h1>
  <div class="muted" id="authSubtitle">Твой личный мессенджер</div>
  <div id="authForm" class="form hidden">
   <input id="email" class="field" type="email" autocomplete="email" placeholder="Электронная почта">
   <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Пароль (минимум 8 символов)">
   <input id="username" class="field hidden" autocomplete="username" placeholder="Уникальный ник (латиница, цифры, _)">
   <button id="authSubmit" class="primary" onclick="submitAuth()">Войти</button>
   <button class="link" id="authSwitch" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</button>
   <div id="authError" class="error"></div>
  </div>
 </div>
</div>
<div class="app hidden" id="app">
 <aside class="sidebar">
  <div class="brand"><div class="logo">U</div><div><div class="brand-name">UGR</div><div class="brand-sub">MESSENGER</div></div></div>
  <div class="search"><input id="searchChats" placeholder="Поиск чатов..." oninput="renderChats()"></div>
  <div class="toolbar"><button class="smallbtn" onclick="openFind()">＋ Найти пользователя</button><button class="smallbtn" onclick="openProfile()">Профиль</button><button class="smallbtn" onclick="openTop10()">🏆 TOP-10</button><button class="smallbtn" onclick="openNotifications()">🔔 Уведомления <span id="notificationBadge" class="badge-count hidden">0</span></button></div>
  <section class="developer-card" aria-label="Разработчик UGR">
   <div class="developer-card-head"><span class="dev-orb">✦</span><div><strong>UGR Developer</strong><small>Создатель мессенджера</small></div></div>
   <div class="developer-identity">@ugr_creator <span class="verified-badge" title="Разработчик UGR">✓</span></div>
   <div class="developer-actions"><button class="smallbtn" onclick="openDeveloperProfile()">Профиль</button><button class="smallbtn developer-write" onclick="openDeveloperChat()">Написать</button></div>
  </section>
  <div class="section">ВАШИ ЧАТЫ</div><div class="chat-list" id="chatList"></div>
  <div class="sidebar-bottom"><div class="me-avatar" id="myAvatar">U</div><div class="me"><strong id="myName">Профиль</strong><small id="myEmail"></small></div><button class="icon-btn" onclick="signOut()" title="Выйти">↪</button></div>
 </aside>
 <main class="main">
  <header class="topbar"><button class="icon-btn mobile-back" onclick="backToChats()">‹</button><div class="avatar" id="headAvatar">U</div><div class="top-info"><strong id="headName">UGR MESSENGER</strong><small id="headStatus">Выбери чат</small></div><div class="topbar-tools"><button class="smallbtn" onclick="searchMessagesAll()" title="Поиск сообщений">⌕</button><button class="smallbtn" onclick="openSavedMessages()" title="Сохранённое">★</button><button class="smallbtn" onclick="openPinnedMessages()" title="Закреплённое">📌</button></div></header>
  <section class="messages" id="messages"><div class="empty"><div style="font-size:42px">✦</div>Найди друга и начни общение</div></section>
  <div class="composer-wrap"><div id="ugrFormatBar" class="format-bar" aria-label="Форматирование"></div><div class="composer"><textarea id="messageInput" rows="1" placeholder="Написать сообщение..." disabled></textarea><button class="send" id="send" onclick="sendMessage()" disabled>➤</button></div><div class="hint">Enter — отправить · Shift + Enter — новая строка · Форматирование поддерживается</div></div>
 </main>

// UGR chat organization: locally managed favourites and archive filters.
let UGR_CHAT_FILTER='all';
function ugrChatMeta(){const d=localData();d.chatMeta=d.chatMeta||{};return d.chatMeta}
function setUGRChatMeta(id,key,value){const d=localData();d.chatMeta=d.chatMeta||{};d.chatMeta[id]=d.chatMeta[id]||{};d.chatMeta[id][key]=value;setLocalData(d);renderChats()}
function buildChatFilters(){const list=$('chatList');let bar=document.getElementById('ugrChatFilters');if(!bar){bar=document.createElement('div');bar.id='ugrChatFilters';bar.style.cssText='display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px';list.parentNode.insertBefore(bar,list)}bar.innerHTML='';[['all','Все'],['fav','⭐ Избранное'],['archive','📦 Архив']].forEach(([key,label])=>{const b=document.createElement('button');b.className='smallbtn';b.textContent=label;b.style.opacity=UGR_CHAT_FILTER===key?'1':'.65';b.onclick=()=>{UGR_CHAT_FILTER=key;renderChats()};bar.append(b)})}
function renderChats(){
 buildChatFilters();const q=$('searchChats').value.toLowerCase();$('chatList').innerHTML='';const meta=ugrChatMeta();
 chats.filter(c=>('@'+c.other.username).toLowerCase().includes(q)).filter(c=>UGR_CHAT_FILTER==='all'?!meta[c.id]?.archived:UGR_CHAT_FILTER==='fav'?!!meta[c.id]?.favorite:!!meta[c.id]?.archived).forEach(c=>{

  const av=c.other.avatar_url?document.createElement('img'):document.createElement('div');av.className=c.other.avatar_url?'profilepic':'avatar';renderAvatar(av,c.other);if(c.other.avatar_url)av.src=c.other.avatar_url;
  const info=document.createElement('div');info.className='chat-info';
  const top=document.createElement('div');top.className='chat-top';const n=document.createElement('span');n.className='chat-name';n.textContent=(c.other.profile_private?'Закрытый профиль':'@'+(c.other.username||'пользователь'))+(isChatMuted(c.id)?' 🔕':'');
  const t=document.createElement('span');t.className='time';t.textContent=c.last?new Date(c.last.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
  const p=document.createElement('div');p.className='preview';p.textContent=c.last?.body||'Начните переписку';
  top.append(n,t);info.append(top,p);el.append(av,info);el.onclick=()=>openChat(c);el.oncontextmenu=e=>{e.preventDefault();const m=ugrChatMeta()[c.id]||{};const action=prompt('Управление чатом: 1 — '+(m.favorite?'убрать из избранного':'добавить в избранное')+'; 2 — '+(m.archived?'вернуть из архива':'архивировать')+'; 3 — отмена');if(action==='1')setUGRChatMeta(c.id,'favorite',!m.favorite);else if(action==='2')setUGRChatMeta(c.id,'archived',!m.archived)};$('chatList').append(el);
 });
}

async function startChat(person){
 if(!person?.id||person.id===currentUser?.id){toast('Нельзя открыть чат с этим пользователем');return}
 try{const {data,error}=await sb.rpc('create_or_get_direct_conversation',{other_user_id:person.id});if(error)throw error;
  const conversationId=typeof data==='string'?data:(Array.isArray(data)?(data[0]?.id||data[0]?.conversation_id):(data?.id||data?.conversation_id));
  await loadChats();closeModal();let c=conversationId?chats.find(x=>x.id===conversationId):null;
  if(!c)c=chats.find(x=>x.other?.id===person.id||x.other?.user_id===person.id);
  if(c){openChat(c);return}
  // If the RPC returned a conversation but the membership list did not refresh yet, retry once.
  await new Promise(resolve=>setTimeout(resolve,250));await loadChats();
  c=conversationId?chats.find(x=>x.id===conversationId):chats.find(x=>x.other?.id===person.id||x.other?.user_id===person.id);
  if(c)openChat(c);else toast('Чат создан, но пока не отображается. Проверь создание участников чата в Supabase.');
 }catch(e){toast(e.message||'Не удалось создать чат')}
}

 $('messageInput').disabled=false;$('send').disabled=false;$('messages').innerHTML='<div class="empty">Загружаем сообщения…</div>';$('app').classList.add('show-chat');renderChats();
 // Subscribe first so messages arriving while history loads are not missed. appendMessage deduplicates IDs.
 channel=sb.channel('ugr-chat-'+c.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+c.id},payload=>{if(payload.new.sender_id!==currentUser.id){appendMessage(payload.new);markIncomingRead(c.id)}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+c.id},payload=>updateReadMark(payload.new)).subscribe();
 await loadMessages(c.id);$('messageInput').value=loadDraft(c.id);$('messageInput').style.height='42px';$('messageInput').style.height=Math.min($('messageInput').scrollHeight,110)+'px';await markIncomingRead(c.id);
}

function appendMessage(m){

 const b=document.createElement('div');b.className='bubble'+(m.sender_id===currentUser.id?' mine':'');b.dataset.id=m.id;

 if(m.sender_id===currentUser.id){const mark=document.createElement('span');mark.className='readmark';mark.dataset.read='';mark.textContent=m.read_at?'✓✓':'✓';tm.append(mark)}b.append(body,tm);
 const tools=document.createElement('div');tools.className='msg-tools';const reply=document.createElement('button');reply.textContent='↩';reply.title='Ответить';reply.onclick=()=>replyToMessage(m);const copy=document.createElement('button');copy.textContent='⧉';copy.title='Копировать';copy.onclick=()=>copyMessageText(m.body);const fwd=document.createElement('button');fwd.textContent='➦';fwd.title='Переслать';fwd.onclick=()=>forwardMessage(m);const pin=document.createElement('button');pin.textContent=isPinned(m.id)?'📌':'📍';pin.title='Закрепить';pin.onclick=()=>togglePinned(m,pin);const react=document.createElement('button');react.textContent='☺';react.title='Реакция';react.onclick=()=>addReaction(m.id);const save=document.createElement('button');save.textContent=isSaved(m.id)?'★':'☆';save.title='Сохранить';save.onclick=()=>toggleSaved(m,save);tools.append(reply,copy,fwd,pin,react,save);
 if(m.sender_id===currentUser.id){const edit=document.createElement('button');edit.textContent='✎';edit.title='Редактировать';edit.onclick=()=>editOwnMessage(m);const del=document.createElement('button');del.textContent='×';del.title='Удалить';del.onclick=()=>deleteOwnMessage(m);tools.append(edit,del)}
 b.append(tools);renderReactions(b,m.id);$('messages').append(b);scrollMessages();
}

// UGR inline formatting and safe lightweight markup rendering.
function insertComposerMarkup(open,close=open){const input=$('messageInput');if(!input||input.disabled)return;const start=input.selectionStart,end=input.selectionEnd,selected=input.value.slice(start,end),replacement=open+selected+close;input.value=input.value.slice(0,start)+replacement+input.value.slice(end);input.focus();const cursor=selected?start+replacement.length:start+open.length;input.setSelectionRange(cursor,cursor);input.dispatchEvent(new Event('input',{bubbles:true}));}
function renderMessageFormatting(container,text){container.textContent='';const lines=String(text||'').split('\n');lines.forEach((line,li)=>{if(li)container.append(document.createElement('br'));const pattern=/\*\*(.+?)\*\*|\*(.+?)\*|~~(.+?)~~|`([^`]+)`/g;let last=0,match;while((match=pattern.exec(line))){if(match.index>last)container.append(document.createTextNode(line.slice(last,match.index)));let el;if(match[1]){el=document.createElement('strong');el.textContent=match[1]}else if(match[2]){el=document.createElement('em');el.textContent=match[2]}else if(match[3]){el=document.createElement('del');el.textContent=match[3]}else{el=document.createElement('span');el.className='formatted-code';el.textContent=match[4]}container.append(el);last=pattern.lastIndex}if(last<line.length)container.append(document.createTextNode(line.slice(last)))});}
(function buildFormatBar(){const bar=$('ugrFormatBar');if(!bar)return;[['B','**','**','Жирный'],['I','*','*','Курсив'],['S','~~','~~','Зачёркнутый'],['⌘','`','`','Код']].forEach(([label,open,close,title])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.title=title;b.onclick=()=>insertComposerMarkup(open,close);bar.append(b)});})();
// UGR: search within the currently opened conversation (loaded message history).
function searchCurrentChat(){
 if(!activeChat){toast('Сначала открой чат');return}
 const query=prompt('Найти в текущем чате:');if(!query||!query.trim())return;
 const q=query.trim().toLowerCase();
 const nodes=[...$('messages').querySelectorAll('.bubble[data-id]')];
 const hits=nodes.filter(n=>(n.innerText||'').toLowerCase().includes(q));
 $('modalTitle').textContent='⌕ Поиск в @'+(activeChat.other.username||'чате');
 $('modalBody').innerHTML=hits.length?hits.map((n,i)=>'<div class="message-search-result" data-chat-hit="'+n.dataset.id+'"><div class="result-meta">Результат '+(i+1)+'</div><div class="result-text"></div></div>').join(''):'<div class="muted">Ничего не найдено в загруженной истории.</div>';
 $('modal').classList.remove('hidden');
 const rows=[...$('modalBody').querySelectorAll('[data-chat-hit]')];rows.forEach((r,i)=>{r.querySelector('.result-text').textContent=hits[i].innerText.replace(/\n/g,' ').slice(0,500);r.onclick=()=>{closeModal();highlightMessage(hits[i].dataset.id)}});
}
(()=>{const tools=document.querySelector('.topbar-tools');if(tools&&!document.getElementById('ugrChatTools')){const b=document.createElement('button');b.className='smallbtn';b.id='ugrChatTools';b.textContent='⚙';b.title='Настройки чата';b.onclick=openChatTools;tools.append(b)}if(tools&&!document.getElementById('ugrChatSearch')){const sbt=document.createElement('button');sbt.className='smallbtn';sbt.id='ugrChatSearch';sbt.textContent='⌕ Чат';sbt.title='Поиск в текущем чате';sbt.onclick=searchCurrentChat;tools.append(sbt)}const toolbar=document.querySelector('.toolbar');if(toolbar&&!document.getElementById('ugrStatsButton')){const b=document.createElement('button');b.className='smallbtn';b.id='ugrStatsButton';b.textContent='📊 Активность';b.onclick=openUGRStats;toolbar.append(b)}})();

document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='f'){e.preventDefault();searchCurrentChat()}});
// === UGR 2.0: large local productivity module (notes, checklist, scheduled messages) ===
function ugrTaskStore(){const d=localData();d.chatTasks=d.chatTasks||{};return d.chatTasks}
function ugrNoteStore(){const d=localData();d.chatNotes=d.chatNotes||{};return d.chatNotes}
function chatTasksFor(id){return ugrTaskStore()[id]||[]}
function chatNoteFor(id){return ugrNoteStore()[id]||''}
function saveChatNote(id,text){const d=localData();d.chatNotes=d.chatNotes||{};d.chatNotes[id]=text;setLocalData(d)}
function addChatTask(id,text){const d=localData();d.chatTasks=d.chatTasks||{};d.chatTasks[id]=d.chatTasks[id]||[];d.chatTasks[id].push({id:'t'+Date.now(),text,done:false,created:new Date().toISOString()});setLocalData(d)}
function toggleChatTask(id,taskId){const d=localData();d.chatTasks=d.chatTasks||{};(d.chatTasks[id]||[]).forEach(t=>{if(t.id===taskId)t.done=!t.done});setLocalData(d)}
function removeChatTask(id,taskId){const d=localData();d.chatTasks=d.chatTasks||{};d.chatTasks[id]=(d.chatTasks[id]||[]).filter(t=>t.id!==taskId);setLocalData(d)}
function openChatNotebook(){if(!activeChat){toast('Сначала открой чат');return}const id=activeChat.id, tasks=chatTasksFor(id),note=chatNoteFor(id);$('modalTitle').textContent='🗒️ Заметки и задачи · @'+(activeChat.other.username||'чат');$('modalBody').innerHTML='<label class="muted">Личная заметка к переписке (не отправляется собеседнику)</label><textarea id="chatPrivateNote" class="field" rows="4" placeholder="Запиши что-нибудь важное..."></textarea><button class="smallbtn" id="noteSave">Сохранить заметку</button><div class="divider"></div><h3>☑️ Список задач</h3><div class="row"><input id="chatTaskInput" class="field" placeholder="Добавить задачу"><button class="primary" id="chatTaskAdd">+</button></div><div id="chatTaskList"></div><div class="muted">Заметки и задачи хранятся локально в этом браузере.</div>';$('modalBody').querySelector('#chatPrivateNote').value=note;$('modal').classList.remove('hidden');$('noteSave').onclick=()=>{saveChatNote(id,$('chatPrivateNote').value);toast('Заметка сохранена')};function render(){const list=$('chatTaskList');if(!list)return;list.innerHTML='';chatTasksFor(id).forEach(t=>{const row=document.createElement('div');row.className='message-search-result';row.style.display='flex';row.style.alignItems='center';row.style.gap='8px';const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.onchange=()=>{toggleChatTask(id,t.id);render()};const label=document.createElement('span');label.textContent=t.text;label.style.flex='1';label.style.textDecoration=t.done?'line-through':'none';const del=document.createElement('button');del.className='smallbtn';del.textContent='×';del.onclick=()=>{removeChatTask(id,t.id);render()};row.append(cb,label,del);list.append(row)})};$('chatTaskAdd').onclick=()=>{const v=$('chatTaskInput').value.trim();if(!v)return;addChatTask(id,v);$('chatTaskInput').value='';render()};$('chatTaskInput').onkeydown=e=>{if(e.key==='Enter')$('chatTaskAdd').click()};render()}
function scheduledStore(){const d=localData();d.scheduled=d.scheduled||[];return d.scheduled}
function openScheduledMessages(){const items=scheduledStore().slice().sort((a,b)=>new Date(a.due)-new Date(b.due));$('modalTitle').textContent='🕓 Отложенные сообщения';$('modalBody').innerHTML=items.length?items.map(x=>'<div class="message-search-result" data-schedule="'+x.id+'"><div class="result-meta">@'+x.username+' · '+new Date(x.due).toLocaleString('ru-RU')+'</div><div class="result-text"></div><button class="smallbtn schedule-cancel">Отменить</button></div>').join(''):'<div class="muted">Отложенных сообщений пока нет.</div>';$('modal').classList.remove('hidden');[...$('modalBody').querySelectorAll('[data-schedule]')].forEach((r,i)=>{r.querySelector('.result-text').textContent=items[i].body;r.onclick=e=>{if(e.target.classList.contains('schedule-cancel')){const d=localData();d.scheduled=(d.scheduled||[]).filter(x=>x.id!==items[i].id);setLocalData(d);openScheduledMessages();return}const c=chats.find(x=>x.id===items[i].conversation_id);if(c){closeModal();openChat(c)}}})}
function scheduleMessageFromComposer(){if(!activeChat){toast('Сначала открой чат');return}const body=$('messageInput').value.trim();if(!body){toast('Напиши сообщение перед планированием');return}const date=prompt('Дата и время отправки (например 2026-11-22 18:30)');if(!date)return;const due=new Date(date.replace(' ','T'));if(!Number.isFinite(due.getTime())||due.getTime()<=Date.now()){toast('Выбери дату и время в будущем');return}const d=localData();d.scheduled=d.scheduled||[];d.scheduled.push({id:'s'+Date.now(),conversation_id:activeChat.id,username:activeChat.other.username||'чат',body,due:due.toISOString(),created:new Date().toISOString()});setLocalData(d);$('messageInput').value='';saveDraft(activeChat.id,'');toast('Сообщение запланировано. Отправка произойдёт, когда UGR открыт и активен.')}
async function checkScheduledMessages(){if(!currentUser||!sb)return;const d=localData(),now=Date.now(),due=(d.scheduled||[]).filter(x=>new Date(x.due).getTime()<=now&&!x.sending);if(!due.length)return;for(const item of due){const c=chats.find(x=>x.id===item.conversation_id);if(!c){toast('Отложенное сообщение @'+item.username+' ожидает загрузки чата');continue}item.sending=true;setLocalData(d);const {data,error}=await sb.from('messages').insert({conversation_id:item.conversation_id,sender_id:currentUser.id,body:item.body}).select().single();const latest=localData();latest.scheduled=(latest.scheduled||[]).filter(x=>x.id!==item.id);if(error){latest.scheduled.push({...item,sending:false});setLocalData(latest);toast('Не удалось отправить отложенное: '+error.message);continue}setLocalData(latest);if(activeChat?.id===item.conversation_id)appendMessage(data);c.last=data;renderChats();toast('🕓 Отложенное сообщение отправлено @'+item.username)}}
function openUGRUtilityHub(){ $('modalTitle').textContent='🧰 UGR — инструменты';$('modalBody').innerHTML='<button class="smallbtn" id="hubSchedule">🕓 Отложенные сообщения</button><button class="smallbtn" id="hubReminders">⏰ Напоминания</button><button class="smallbtn" id="hubSaved">⭐ Сохранённое</button><button class="smallbtn" id="hubPins">📌 Закреплённые</button><button class="smallbtn" id="hubStats">📊 Активность</button><button class="smallbtn" id="hubNotebook">🗒️ Заметки и задачи текущего чата</button><div class="muted">Заметки, задачи, напоминания и расписание хранятся локально. Отложенная отправка требует открытого приложения.</div>';$('modal').classList.remove('hidden');$('hubSchedule').onclick=openScheduledMessages;$('hubReminders').onclick=openUGRReminders;$('hubSaved').onclick=openSavedMessages;$('hubPins').onclick=openPinnedMessages;$('hubStats').onclick=openUGRStats;$('hubNotebook').onclick=openChatNotebook}
(()=>{const tools=document.querySelector('.topbar-tools');if(tools&&!document.getElementById('ugrNotebook')){const b=document.createElement('button');b.className='smallbtn';b.id='ugrNotebook';b.textContent='🗒️';b.title='Личные заметки и задачи чата';b.onclick=openChatNotebook;tools.append(b)}const composer=document.querySelector('.composer');if(composer&&!document.getElementById('ugrScheduleSend')){const b=document.createElement('button');b.className='smallbtn';b.id='ugrScheduleSend';b.textContent='🕓';b.title='Запланировать отправку';b.onclick=scheduleMessageFromComposer;composer.insertBefore(b,composer.lastElementChild)}const toolbar=document.querySelector('.toolbar');if(toolbar&&!document.getElementById('ugrUtilityHub')){const b=document.createElement('button');b.className='smallbtn';b.id='ugrUtilityHub';b.textContent='🧰 UGR';b.onclick=openUGRUtilityHub;toolbar.append(b)}})();
window.addEventListener('focus',()=>{checkUGRReminders();checkScheduledMessages()});document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkUGRReminders();checkScheduledMessages()}});setInterval(()=>{checkUGRReminders();checkScheduledMessages()},30000);
// === end UGR productivity module ===
